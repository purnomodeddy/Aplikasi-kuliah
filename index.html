<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kuliah STIT INSIDA</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; min-height: 100vh; }
        .login-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #2563EB, #1E40AF); }
        .login-box { background: white; padding: 40px; border-radius: 10px; width: 90%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .login-box h2 { text-align: center; color: #2563EB; margin-bottom: 30px; font-size: 28px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #2563EB; }
        .btn { width: 100%; padding: 12px; background: #2563EB; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #1E40AF; }
        .error { color: red; font-size: 12px; margin-top: 10px; text-align: center; }
        .debug { background: #fff3cd; border: 1px solid #ffc107; padding: 10px; margin-top: 20px; font-size: 11px; color: #333; max-height: 150px; overflow-y: auto; font-family: monospace; }
        .dashboard { display: none; padding: 30px; }
        .dashboard.active { display: block; }
        .navbar { background: #2563EB; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { font-size: 20px; }
        .navbar button { background: rgba(255,255,255,0.3); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div id="app">

<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <h2>Login</h2>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" value="purnomodeddy828@gmail.com">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="password" value="Deddyp84">
        </div>
        <button class="btn" id="loginBtn" type="button">Login</button>
        <div class="error" id="error"></div>
        <div class="debug" id="debug"></div>
    </div>
</div>

<div id="dashboard" class="dashboard">
    <div class="navbar">
        <h1>Aplikasi Kuliah STIT INSIDA</h1>
        <button type="button" onclick="doLogout()">Logout</button>
    </div>
    <h2 id="userDisplay" style="margin: 30px 0;"></h2>
    <p style="color: #666;">Login berhasil! Aplikasi Anda siap digunakan.</p>
</div>

</div>

<script>
// CONFIG
const SUPABASE_URL = 'https://kqgojxzszljnsiblsnsc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WR_6SHV9Ix9ruyg5mingRA_7RZ9VYPJLvYXLrqmqBT4WdpS0GjJG2D8SAyMx4nfJvK5dqc2qYJvqx56bGJYpT7JJ1wMkK6eJaWx6wz8vvM4yYJrQ3Z6Q8K8yJPK3vhXvXzf5nF6H9kR7vKzqQ6wqJgX8';

let debugLog = [];
let supabase = null;
let currentUser = null;

function log(msg) {
    debugLog.push('[' + new Date().toLocaleTimeString() + '] ' + msg);
    document.getElementById('debug').innerHTML = debugLog.join('<br>');
    console.log(msg);
}

function initSupabase() {
    try {
        log('Starting Supabase init...');
        if (!window.supabase) {
            log('ERROR: window.supabase is undefined!');
            return false;
        }
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        log('Supabase initialized OK');
        return true;
    } catch (e) {
        log('ERROR init: ' + e.message);
        return false;
    }
}

function doLogin() {
    log('doLogin() called');
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('error');
    
    log('Email: ' + email);
    
    if (!supabase) {
        log('ERROR: supabase not initialized');
        errorDiv.textContent = 'Error: Supabase not initialized';
        return;
    }
    
    log('Calling signInWithPassword...');
    
    supabase.auth.signInWithPassword({email, password})
        .then(function(result) {
            log('SignIn response received');
            if (result.error) {
                log('SignIn error: ' + result.error.message);
                errorDiv.textContent = 'Login failed: ' + result.error.message;
                return;
            }
            log('Login success! User: ' + result.data.user.email);
            currentUser = result.data.user;
            showDashboard();
        })
        .catch(function(e) {
            log('Exception: ' + e.message);
            errorDiv.textContent = 'Error: ' + e.message;
        });
}

function showDashboard() {
    log('Showing dashboard...');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').classList.add('active');
    document.getElementById('userDisplay').textContent = 'Selamat datang, ' + currentUser.email;
}

function doLogout() {
    supabase.auth.signOut();
    currentUser = null;
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dashboard').classList.remove('active');
}

document.getElementById('loginBtn').addEventListener('click', function() {
    log('Login button clicked (addEventListener)');
    doLogin();
});

window.addEventListener('load', function() {
    log('Page loaded, initializing...');
    if (initSupabase()) {
        log('App ready');
    }
});

log('Script running');
</script>

</body>
</html>
